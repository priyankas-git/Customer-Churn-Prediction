<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Churn Prediction</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Customer Churn Prediction</h1>
      <p class="subtitle">Predict whether a customer is likely to churn.</p>
    </header>

    <main>
      <form id="churnForm">
        <div class="form-group">
          <label for="tenure">Tenure (months):</label>
          <input type="number" id="tenure" name="tenure" min="0" step="1" required placeholder="e.g. 12">
        </div>

        <div class="form-group">
          <label for="monthlyCharges">Monthly Charges ($):</label>
          <input type="number" id="monthlyCharges" name="monthlyCharges" min="0" step="0.01" required placeholder="e.g. 82.40">
        </div>

        <div class="form-group">
          <label for="totalCharges">Total Charges ($):</label>
          <input type="number" id="totalCharges" name="totalCharges" min="0" step="0.01" required placeholder="e.g. 988.80">
        </div>

        <div class="form-group">
          <label for="contractType">Contract Type:</label>
          <select id="contractType" name="contractType" required>
            <option value="Month-to-month">Month-to-month</option>
            <option value="One year">One year</option>
            <option value="Two year">Two year</option>
          </select>
        </div>

        <div class="form-group">
          <label for="internetService">Internet Service:</label>
          <select id="internetService" name="internetService" required>
            <option value="DSL">DSL</option>
            <option value="Fiber optic">Fiber optic</option>
          </select>
        </div>

        <div class="form-group">
          <label for="techSupport">Tech Support:</label>
          <select id="techSupport" name="techSupport" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>

        <button type="submit" id="predictBtn">Predict Churn</button>
      </form>

      <div id="resultContainer" class="result-box hidden">
        <h2>Prediction Result</h2>
        <p><strong>Prediction:</strong> <span id="predictionText">-</span></p>
        <p><strong>Churn Probability:</strong> <span id="probabilityText">-</span></p>
      </div>

      <div id="errorContainer" class="error-box hidden">
        <p id="errorMessage"></p>
      </div>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
